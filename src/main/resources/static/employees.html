
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .employee-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }
        .employee-form {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }
        .employee-form input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }
        .employee-form button, .delete-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #1769aa;
            color: white;
            cursor: pointer;
        }
        .delete-btn {
            background: #dc3545;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #1769aa;
            color: white;
        }
        #message {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="employee-container">
        <h1>Employee Management</h1>
        <p>Add and manage company employees.</p>

        <h2>Add New Employee</h2>
        <form class="employee-form" id="employeeForm">
            <input id="name" type="text" placeholder="Employee Name" required>
            <input id="email" type="email" placeholder="Email" required>
            <input id="department" type="text" placeholder="Department" required>
            <input id="designation" type="text" placeholder="Designation" required>
            <button type="submit">Add Employee</button>
        </form>

        <p id="message"></p>

        <h2>Employee List</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="employeeTable"></tbody>
            </table>
        </div>
        <p><a href="index.html">Back to Home</a></p>
    </div>

    <script>
        const form = document.getElementById("employeeForm");
        const table = document.getElementById("employeeTable");
        const message = document.getElementById("message");

        async function loadEmployees() {
            try {
                const response = await fetch("/api/employees");
                if (!response.ok) throw new Error("Unable to load employees");

                const employees = await response.json();
                table.innerHTML = "";

                employees.forEach(emp => {
                    const row = document.createElement("tr");

                    [emp.id, emp.name, emp.email,
                     emp.department, emp.designation].forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "";
                        row.appendChild(cell);
                    });

                    const actionCell = document.createElement("td");
                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete-btn";
                    deleteButton.onclick = () => deleteEmployee(emp.id);
                    actionCell.appendChild(deleteButton);
                    row.appendChild(actionCell);

                    table.appendChild(row);
                });
            } catch (error) {
                message.textContent = error.message;
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const employee = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                department: document.getElementById("department").value.trim(),
                designation: document.getElementById("designation").value.trim()
            };

            try {
                const response = await fetch("/api/employees", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(employee)
                });

                if (!response.ok) throw new Error("Employee could not be added");

                message.textContent = "Employee added successfully!";
                form.reset();
                await loadEmployees();
            } catch (error) {
                message.textContent = error.message;
            }
        });

        async function deleteEmployee(id) {
            if (!confirm("Are you sure you want to delete this employee?")) {
                return;
            }

            try {
                const response = await fetch(`/api/employees/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) throw new Error("Could not delete employee");

                message.textContent = "Employee deleted successfully!";
                await loadEmployees();
            } catch (error) {
                message.textContent = error.message;
            }
        }

        loadEmployees();
    </script>
</body>
</html>
