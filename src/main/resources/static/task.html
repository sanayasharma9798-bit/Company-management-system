
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .task-container {
            max-width: 950px;
            margin: 30px auto;
            padding: 20px;
        }
        .task-form {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }
        .task-form input,
        .task-form textarea,
        .task-form select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }
        .task-form button, .action-btn {
            padding: 9px 14px;
            border: none;
            border-radius: 5px;
            background: #1769aa;
            color: white;
            cursor: pointer;
        }
        .delete-btn {
            background: #dc3545;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #1769aa;
            color: white;
        }
        #message {
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="task-container">
        <h1>Task Management</h1>
        <p>Assign tasks to employees and manage their status.</p>

        <h2>Assign New Task</h2>
        <form class="task-form" id="taskForm">
            <input id="title" type="text"
                   placeholder="Task Title" required>

            <textarea id="description"
                      placeholder="Task Description"
                      required></textarea>

            <select id="employeeId" required>
                <option value="">Select Employee</option>
            </select>

            <button type="submit">Assign Task</button>
        </form>

        <p id="message"></p>

        <h2>Task List</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Employee ID</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="taskTable"></tbody>
            </table>
        </div>

        <p><a href="index.html">Back to Home</a></p>
    </div>

    <script>
        const form = document.getElementById("taskForm");
        const employeeSelect = document.getElementById("employeeId");
        const taskTable = document.getElementById("taskTable");
        const message = document.getElementById("message");

        async function loadEmployees() {
            try {
                const response = await fetch("/api/employees");
                if (!response.ok) throw new Error("Could not load employees");

                const employees = await response.json();
                employeeSelect.innerHTML =
                    '<option value="">Select Employee</option>';

                employees.forEach(emp => {
                    const option = document.createElement("option");
                    option.value = emp.id;
                    option.textContent = emp.name + " (ID: " + emp.id + ")";
                    employeeSelect.appendChild(option);
                });
            } catch (error) {
                message.textContent = error.message;
            }
        }

        async function loadTasks() {
            try {
                const response = await fetch("/api/tasks");
                if (!response.ok) throw new Error("Could not load tasks");

                const tasks = await response.json();
                taskTable.innerHTML = "";

                tasks.forEach(task => {
                    const row = document.createElement("tr");

                    [task.id, task.title, task.description,
                     task.employeeId].forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "";
                        row.appendChild(cell);
                    });

                    const statusCell = document.createElement("td");
                    const statusSelect = document.createElement("select");

                    ["PENDING", "IN_PROGRESS", "COMPLETED"].forEach(status => {
                        const option = document.createElement("option");
                        option.value = status;
                        option.textContent = status;
                        statusSelect.appendChild(option);
                    });

                    statusSelect.value = task.status || "PENDING";
                    statusSelect.addEventListener("change", () => {
                        updateStatus(task.id, statusSelect.value);
                    });
                    statusCell.appendChild(statusSelect);
                    row.appendChild(statusCell);

                    const actionCell = document.createElement("td");
                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "action-btn delete-btn";
                    deleteButton.onclick = () => deleteTask(task.id);
                    actionCell.appendChild(deleteButton);
                    row.appendChild(actionCell);

                    taskTable.appendChild(row);
                });
            } catch (error) {
                message.textContent = error.message;
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const task = {
                title: document.getElementById("title").value.trim(),
                description: document.getElementById("description").value.trim(),
                employeeId: Number(employeeSelect.value),
                status: "PENDING"
            };

            try {
                const response = await fetch("/api/tasks", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(task)
                });

                if (!response.ok) throw new Error("Could not assign task");

                message.textContent = "Task assigned successfully!";
                form.reset();
                await loadTasks();
            } catch (error) {
                message.textContent = error.message;
            }
        });

        async function updateStatus(id, status) {
            try {
                const response = await fetch(`/api/tasks/${id}/status`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status: status })
                });

                if (!response.ok) throw new Error("Could not update status");
                message.textContent = "Task status updated!";
            } catch (error) {
                message.textContent = error.message;
                await loadTasks();
            }
        }

        async function deleteTask(id) {
            if (!confirm("Are you sure you want to delete this task?")) {
                return;
            }

            try {
                const response = await fetch(`/api/tasks/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) throw new Error("Could not delete task");

                message.textContent = "Task deleted successfully!";
                await loadTasks();
            } catch (error) {
                message.textContent = error.message;
            }
        }

        loadEmployees();
        loadTasks();
    </script>
</body>
</html>
